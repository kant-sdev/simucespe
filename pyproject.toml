[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simucespe"
version = "0.1.0"
description = "Ingestao e montagem de simulados CEBRASPE para o projeto INSS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pypdf>=4.0,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0,<3.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
simucespe-validate-pair = "simucespe.cli:validate_pair_main"
simucespe-ingest-all = "simucespe.cli:ingest_all_main"
simucespe-api = "simucespe.cli:api_main"

[tool.setuptools.packages.find]
include = ["simucespe*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
